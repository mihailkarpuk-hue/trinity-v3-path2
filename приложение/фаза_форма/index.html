<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тринити — Фаза → Форма (грамматика Гиббса)</title>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:#05060a;color:#e7ecf5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
  .верх{padding:10px 16px;background:#0a0c12;border-bottom:1px solid #1b2130}
  .верх h1{margin:0;font-size:15px;font-weight:650}
  .верх h1 small{color:#8a93a6;font-weight:400;margin-left:8px;font-size:12px}
  #холст{position:absolute;inset:48px 0 64px 0}
  .низ{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;background:#0a0c12;border-top:1px solid #1b2130;text-align:center}
  .карточка{flex:1;max-width:32%}
  .карточка b{font-size:14px} .карточка span{display:block;color:#8a93a6;font-size:11px;margin-top:2px}
  .тег{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;margin-bottom:2px}
</style>
</head>
<body>
<div class="верх"><h1>ТРИНИТИ · Фаза → Форма <small>грамматика Гиббса: одна логика лепит три образа из атомов</small></h1></div>
<div id="холст"></div>
<div class="низ">
  <div class="карточка"><span class="тег" style="background:#1b3a6b">ТОН → кристалл</span><b>А · /а/</b><span>упорядоченная решётка, насыщенный цвет</span></div>
  <div class="карточка"><span class="тег" style="background:#5a3320">ШУМ → дымка</span><b>С · /с/</b><span>рассеянное облако, блёклый цвет</span></div>
  <div class="карточка"><span class="тег" style="background:#4a2d6b">ПЕРЕХОД → мерцание</span><b>Волны</b><span>морфинг между порядком и хаосом</span></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const wrap=document.getElementById('холст');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x05060a);
const cam=new THREE.PerspectiveCamera(50,1,0.1,1000); cam.position.set(0,0,15);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); wrap.appendChild(renderer.domElement);
const controls=new OrbitControls(cam,renderer.domElement); controls.enableDamping=true;
function resize(){const w=wrap.clientWidth||1,h=wrap.clientHeight||1; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(wrap); resize();
function glowTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);const t=new THREE.CanvasTexture(c);t.needsUpdate=true;return t;}
const TEX=glowTex();
function mat(){return new THREE.ShaderMaterial({uniforms:{uTex:{value:TEX}},
 vertexShader:'attribute float size;attribute vec3 color;varying vec3 vC;void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*(320.0/-mv.z);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'uniform sampler2D uTex;varying vec3 vC;void main(){vec4 t=texture2D(uTex,gl_PointCoord);if(t.a<0.02)discard;gl_FragColor=vec4(vC,1.0)*t;}',
 transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});}
function rgb(a){return [a.color_r/255,a.color_g/255,a.color_b/255];}
function desat(c,k){const m=(c[0]+c[1]+c[2])/3;return [c[0]+(m-c[0])*k,c[1]+(m-c[1])*k,c[2]+(m-c[2])*k];}
function snap(v,s){return Math.round(v/s)*s;}
function норм(atoms){ // центрировать и вписать в радиус ~1.8
  let cx=0,cy=0,cz=0; atoms.forEach(a=>{cx+=a.pos_x;cy+=a.pos_y;cz+=a.pos_z;}); const n=atoms.length||1; cx/=n;cy/=n;cz/=n;
  let r=0; atoms.forEach(a=>{r=Math.max(r,Math.hypot(a.pos_x-cx,a.pos_y-cy,a.pos_z-cz));}); const k=1.8/(r||1);
  return atoms.map(a=>({x:(a.pos_x-cx)*k,y:(a.pos_y-cy)*k,z:(a.pos_z-cz)*k,phase:a.phase,c:rgb(a)}));
}
let clusters=[];
async function загрузить(){
  const файлы=[['bukva_a',-5.2],['bukva_s',0],['volny',5.2]];
  for(const [name,offX] of файлы){
    const d=await (await fetch(encodeURI('../../данные/клеточки/эталоны/'+name+'_model3d.json'))).json();
    const A=норм(d.atoms||[]); const n=A.length;
    const pos=new Float32Array(n*3), col=new Float32Array(n*3), sz=new Float32Array(n);
    const base=new Float32Array(n*3), seed=new Float32Array(n); const phs=[];
    for(let i=0;i<n;i++){ const a=A[i]; let x=a.x,y=a.y,z=a.z; let c=a.c.slice(); let s=0.08;
      if(a.phase==='тон'){ x=snap(x,0.26); y=snap(y,0.26); z=snap(z,0.26); s=0.085; // КРИСТАЛЛ — на решётку, ярко
        c=[Math.min(1,c[0]*1.2+0.08),Math.min(1,c[1]*1.2+0.05),Math.min(1,c[2]*1.2+0.05)]; }
      else if(a.phase==='шум'){ x+=(Math.random()-.5)*1.0; y+=(Math.random()-.5)*1.0; z+=(Math.random()-.5)*1.0;
        c=[0.58,0.66,0.82]; s=0.095; } // ДЫМКА — светлая холодная взвесь, видимая
      else { c=desat(c,0.45); c=[Math.min(1,c[0]+0.12),Math.min(1,c[1]+0.12),Math.min(1,c[2]+0.14)]; s=0.085; } // ПЕРЕХОД — морфинг
      base[i*3]=x+offX; base[i*3+1]=y; base[i*3+2]=z; seed[i]=Math.random()*6.28; phs.push(a.phase);
      pos[i*3]=base[i*3]; pos[i*3+1]=base[i*3+1]; pos[i*3+2]=base[i*3+2];
      col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2]; sz[i]=s;
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.BufferAttribute(col,3));
    g.setAttribute('size',new THREE.BufferAttribute(sz,1));
    const pts=new THREE.Points(g,mat()); scene.add(pts);
    clusters.push({pts,g,base,seed,phs,n});
  }
}
загрузить();
function tick(){
  controls.update(); const t=performance.now()*0.001;
  for(const cl of clusters){ const pos=cl.g.getAttribute('position').array; let dirty=false;
    for(let i=0;i<cl.n;i++){ const ph=cl.phs[i];
      if(ph==='переход'){ const s=cl.seed[i]; // мерцание/морфинг: колеблется между порядком и хаосом
        pos[i*3]=cl.base[i*3]+Math.sin(t*1.6+s)*0.28;
        pos[i*3+1]=cl.base[i*3+1]+Math.cos(t*1.3+s*1.7)*0.28;
        pos[i*3+2]=cl.base[i*3+2]+Math.sin(t*1.1+s*0.7)*0.28; dirty=true;
      } else if(ph==='шум'){ const s=cl.seed[i]; // дымка медленно дрейфует
        pos[i*3]=cl.base[i*3]+Math.sin(t*0.5+s)*0.06;
        pos[i*3+1]=cl.base[i*3+1]+Math.cos(t*0.4+s)*0.06; dirty=true;
      }
    }
    if(dirty) cl.g.getAttribute('position').needsUpdate=true;
  }
  renderer.render(scene,cam); requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
